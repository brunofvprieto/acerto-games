name: Auditoria editorial do acervo

on:
  workflow_dispatch: {}
  push:
    paths:
      - "content/publicados/**"
      - "scripts/audit-content.mjs"
      - ".github/workflows/auditoria-editorial.yml"

permissions:
  contents: write

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar auditoria
        run: node scripts/audit-content.mjs
      - name: Atualizar relatório no repositório
        run: |
          git config user.name "acerto-games-bot"
          git config user.email "brunofvprieto@users.noreply.github.com"
          git add AUDITORIA-EDITORIAL.md
          if git diff --cached --quiet; then
            echo "Relatório sem alterações."
          else
            git commit -m "🤖 Atualiza auditoria editorial do acervo"
            git push
          fi
      - name: Publicar relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-editorial-acerto-games
          path: AUDITORIA-EDITORIAL.md
