name: Robô Acerto Games

on:
  schedule:
  - cron: "0 10,17,22,0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar-e-escrever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ativar complemento editorial 2026
        run: |
          cp scripts/persona.md /tmp/persona-acerto-original.md
          cat scripts/persona-opiniao.md >> scripts/persona.md

      - name: Rodar o robô
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          trap 'cp /tmp/persona-acerto-original.md scripts/persona.md' EXIT
          node scripts/robo.mjs

      - name: Gate editorial — bloquear conteúdo raso
        shell: bash
        run: |
          mapfile -t ARQUIVOS < <(git diff --name-only -- content/rascunhos content/publicados | grep -E '\\.json$' || true)
          if [ ${#ARQUIVOS[@]} -eq 0 ]; then
            echo "Nenhum JSON novo para validar."
          else
            node scripts/quality-gate.mjs "${ARQUIVOS[@]}"
          fi

      - name: Commitar matérias novas
        run: |
          git config user.name "brunofvprieto"
          git config user.email "brunofvprieto@users.noreply.github.com"
          mkdir -p content/rascunhos content/publicados
          git add -A content public
          if git diff --cached --quiet; then
            echo "Nenhuma matéria nova."
          else
            git commit -m "🤖 Novas matérias do robô"
            git push
          fi
